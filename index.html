<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CuxxyzHost</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b0f14;
  --card:#111827;
  --neon:#00f7ff;
  --neon2:#7c4dff;
  --text:#e5e7eb;
  --muted:#9ca3af;
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'JetBrains Mono', monospace;
  background:radial-gradient(circle at top, #111827, #020617);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

/* ===== PARTIKEL ===== */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle, rgba(255,255,255,.05) 1px, transparent 1px);
  background-size:25px 25px;
  animation: float 20s linear infinite;
  pointer-events:none;
}
@keyframes float{
  from{background-position:0 0}
  to{background-position:200px 400px}
}

/* ===== HEADER ===== */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 26px;
}

.logo{
  font-family:'Orbitron', sans-serif;
  font-size:22px;
  color:var(--neon);
  text-shadow:
    0 0 5px var(--neon),
    0 0 20px var(--neon2);
}

/* MENU */
.menu{
  position:relative;
}
.menu-btn{
  width:42px;height:42px;
  border:1px solid #1f2937;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.menu-btn span{
  width:18px;height:2px;
  background:#cbd5f5;
  position:relative;
}
.menu-btn span::before,
.menu-btn span::after{
  content:"";
  position:absolute;
  width:18px;height:2px;
  background:#cbd5f5;
  left:0;
}
.menu-btn span::before{top:-6px}
.menu-btn span::after{top:6px}

.dropdown{
  display:none;
  position:absolute;
  right:0;
  top:52px;
  background:#020617;
  border:1px solid #1f2937;
  border-radius:12px;
  overflow:hidden;
  min-width:180px;
}
.dropdown a{
  display:block;
  padding:12px 16px;
  color:var(--text);
  text-decoration:none;
}
.dropdown a:hover{
  background:#111827;
}

/* ===== MAIN ===== */
main{
  text-align:center;
  padding:80px 20px;
}

.title{
  font-family:'Orbitron', sans-serif;
  font-size:38px;
  color:var(--neon);
  text-shadow:
    0 0 8px var(--neon),
    0 0 30px var(--neon2);
  margin-bottom:14px;
}

.typing{
  color:var(--muted);
  height:24px;
  margin-bottom:40px;
}

/* ===== BUTTONS ===== */
.buttons{
  display:flex;
  flex-direction:column;
  gap:14px;
  max-width:420px;
  margin:0 auto;
}

.btn{
  background:linear-gradient(135deg,#111827,#020617);
  border:1px solid #1f2937;
  padding:16px;
  border-radius:14px;
  color:white;
  font-size:15px;
  cursor:pointer;
  transition:.3s;
}
.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 0 25px rgba(0,247,255,.15);
}

/* RESPONSIVE */
@media(min-width:640px){
  .buttons{flex-direction:row}
  .btn{flex:1}
}
</style>
</head>
<body>

<header>
  <div class="logo">CuxxyzHost</div>

  <div class="menu">
    <div class="menu-btn" onclick="toggleMenu()">
      <span></span>
    </div>
    <div class="dropdown" id="dropdown">
      <a href="https://wa.me/6281234567890" target="_blank">WhatsApp</a>
      <a href="https://t.me/usernamekamu" target="_blank">Telegram</a>
      <a href="https://t.me/salurankamu" target="_blank">Saluran</a>
      <a href="https://t.me/salurankamu" target="_blank">Saluran</a>
    </div>
  </div>
</header>

<main>
  <div class="title">Cuxxyzhost List</div>
  <div class="typing" id="typing"></div>

  <div class="buttons">
    <button class="btn">Jasteb</button>
    <button class="btn">Pt & reseller & team</button>
    <button class="btn">Pterodactyl</button>
  </div>
</main>

<script>
/* MENU */
function toggleMenu(){
  const d=document.getElementById('dropdown');
  d.style.display=d.style.display==='block'?'none':'block';
}

/* TYPING EFFECT */
const texts=[
  "result murni 2026",
  "Result masa kini"
];
let i=0,j=0,del=false;
const el=document.getElementById("typing");

function type(){
  if(!del && j<=texts[i].length){
    el.textContent=texts[i].slice(0,j++);
  }else if(del && j>=0){
    el.textContent=texts[i].slice(0,j--);
  }

  if(j===texts[i].length+1){
    del=true; setTimeout(type,800); return;
  }
  if(del && j===0){
    del=false; i=(i+1)%texts.length;
  }
  setTimeout(type,del?50:80);
}
type();
</script>

</body>
</html>
