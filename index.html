<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CuxxyzHost</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#020617;
  --card:#020617;
  --neon:#00f7ff;
  --neon2:#7c4dff;
  --text:#e5e7eb;
  --muted:#9ca3af;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'JetBrains Mono', monospace;
  background:#020617;
  color:var(--text);
  min-height:100vh;
  overflow:hidden;
}

/* ===== PARTICLE BACKGROUND ===== */
canvas{
  position:fixed;
  inset:0;
  z-index:-1;
}

/* ===== HEADER ===== */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:22px 28px;
}

.logo{
  font-family:'Orbitron', sans-serif;
  font-size:22px;
  color:var(--neon);
  text-shadow:
    0 0 6px var(--neon),
    0 0 25px var(--neon2);
}

/* MENU */
.menu{position:relative}
.menu-btn{
  width:42px;height:42px;
  border:1px solid #1f2937;
  border-radius:10px;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
}
.menu-btn span,
.menu-btn span::before,
.menu-btn span::after{
  content:"";
  display:block;
  width:18px;height:2px;
  background:#cbd5f5;
  position:relative;
}
.menu-btn span::before{position:absolute;top:-6px}
.menu-btn span::after{position:absolute;top:6px}

.dropdown{
  display:none;
  position:absolute;
  right:0;
  top:52px;
  background:#020617;
  border:1px solid #1f2937;
  border-radius:14px;
  overflow:hidden;
  min-width:180px;
}
.dropdown a{
  display:block;
  padding:12px 16px;
  color:var(--text);
  text-decoration:none;
}
.dropdown a:hover{background:#111827}

/* ===== MAIN ===== */
main{
  text-align:center;
  padding:90px 20px;
}

.welcome{
  display:inline-block;
  padding:6px 14px;
  border:1px solid #1f2937;
  border-radius:8px;
  color:var(--muted);
  margin-bottom:20px;
}

.title{
  font-family:'Orbitron', sans-serif;
  font-size:40px;
  color:var(--neon);
  text-shadow:
    0 0 10px var(--neon),
    0 0 35px var(--neon2);
  margin-bottom:14px;
}

.typing{
  height:24px;
  color:var(--muted);
  margin-bottom:50px;
}

/* ===== RPG NEON BUTTON ===== */
.buttons{
  display:flex;
  flex-direction:column;
  gap:18px;
  max-width:460px;
  margin:0 auto;
}

.rpg-btn{
  position:relative;
  padding:18px;
  background:transparent;
  color:white;
  border:none;
  cursor:pointer;
  font-size:15px;
  border-radius:14px;
  overflow:hidden;
}

.rpg-btn::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:14px;
  padding:2px;
  background:conic-gradient(
    from 0deg,
    transparent,
    var(--neon),
    var(--neon2),
    var(--neon),
    transparent
  );
  animation: spin 3s linear infinite;
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
          mask-composite:exclude;
}

.rpg-btn::after{
  content:"";
  position:absolute;
  inset:2px;
  background:#020617;
  border-radius:12px;
  z-index:-1;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* RESPONSIVE */
@media(min-width:640px){
  .buttons{flex-direction:row}
  .rpg-btn{flex:1}
}
</style>
</head>
<body>

<canvas id="particle"></canvas>

<header>
  <div class="logo">./CuxxyzHost</div>

  <div class="menu">
    <div class="menu-btn" onclick="toggleMenu()"><span></span></div>
    <div class="dropdown" id="dropdown">
      <a href="https://wa.me/6281234567890" target="_blank">WhatsApp</a>
      <a href="https://t.me/usernamekamu" target="_blank">Telegram</a>
      <a href="https://t.me/salurankamu" target="_blank">Saluran</a>
      <a href="https://t.me/salurankamu" target="_blank">Saluran</a>
    </div>
  </div>
</header>

<main>
  <div class="welcome">$ "Welcome"</div>

  <div class="title">the  ./CuxxyzHost List</div>
  <div class="typing" id="typing"></div>

  <div class="buttons">
    <button class="rpg-btn">Jasteb</button>
    <button class="rpg-btn">Pt & reseller & team</button>
    <button class="rpg-btn">Pterodactyl</button>
  </div>
</main>

<script>
/* MENU */
function toggleMenu(){
  const d=document.getElementById('dropdown');
  d.style.display=d.style.display==='block'?'none':'block';
}

/* TYPING */
const texts=["result murni 2026","Result masa kini"];
let i=0,j=0,del=false;
const el=document.getElementById("typing");

function type(){
  if(!del && j<=texts[i].length){
    el.textContent=texts[i].slice(0,j++);
  }else if(del && j>=0){
    el.textContent=texts[i].slice(0,j--);
  }
  if(j===texts[i].length+1){del=true;setTimeout(type,800);return;}
  if(del && j===0){del=false;i=(i+1)%texts.length;}
  setTimeout(type,del?50:80);
}
type();

/* PARTICLES */
const c=document.getElementById("particle");
const ctx=c.getContext("2d");
let w,h,particles=[];
function resize(){
  w=c.width=window.innerWidth;
  h=c.height=window.innerHeight;
}
window.onresize=resize;resize();

for(let i=0;i<80;i++){
  particles.push({
    x:Math.random()*w,
    y:Math.random()*h,
    r:Math.random()*2+1,
    vx:(Math.random()-.5)*0.6,
    vy:(Math.random()-.5)*0.6
  });
}

function draw(){
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle="rgba(0,247,255,.5)";
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0||p.x>w)p.vx*=-1;
    if(p.y<0||p.y>h)p.vy*=-1;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  });
  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
