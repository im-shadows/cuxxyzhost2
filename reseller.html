<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reseller Jasteb | CuxxyzHost</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Orbitron:wght@600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'JetBrains Mono', monospace;
  background:#020617;
  color:#e5e7eb;
}
header{
  display:flex;
  justify-content:space-between;
  padding:20px 24px;
}
.logo{
  font-family:'Orbitron',sans-serif;
  color:#00f7ff;
  text-shadow:0 0 12px #00f7ff;
  cursor:pointer;
}
.menu a{color:white;text-decoration:none;margin-left:14px}
main{
  max-width:520px;
  margin:auto;
  padding:60px 16px;
  text-align:center;
}
h1{
  font-family:'Orbitron',sans-serif;
  color:#00f7ff;
  text-shadow:0 0 14px #00f7ff;
}
.card{
  margin-top:40px;
  border:1px solid #1f2937;
  border-radius:16px;
  padding:20px;
  text-align:left;
}
.label{font-size:12px;color:#9ca3af;margin-bottom:6px}
select,.box{
  width:100%;
  padding:12px;
  border-radius:10px;
  background:#020617;
  border:1px solid #1f2937;
  color:white;
}
.btn{
  margin-top:14px;
  width:100%;
  padding:12px;
  border:1px solid #00f7ff;
  background:none;
  color:#00f7ff;
  border-radius:12px;
  cursor:pointer;
}
.small-btn{
  margin-top:10px;
  font-size:12px;
  color:#7dd3fc;
  cursor:pointer;
  text-decoration:underline;
}
</style>
</head>
<body>

<header>
  <div class="logo" onclick="location.href='index.html'">./CuxxyzHost</div>
  <div class="menu">
    <a href="index.html">Home</a>
    <a href="https://wa.me/6283128490718" target="_blank">WA</a>
    <a href="https://t.me/cuxxyzhost" target="_blank">Tele</a>
  </div>
</header>

<main>
  <h1>&gt;_ Reseller-Jasteb</h1>

  <div class="card">
    <div class="label">_produk</div>
    <select id="produk" onchange="update()">
      <option value="Pt-Jasteb|10000">Pt-Jasteb</option>
      <option value="Team-Jasteb|10000">Team-Jasteb</option>
      <option value="Panel-Prib|15000">Panel-Prib</option>
      <option value="Reseller-Panel|6000">Reseller-Panel</option>
    </select>

    <div class="label" style="margin-top:14px">_harga</div>
    <div class="box" id="harga">Rp 10.000</div>

    <button class="btn" onclick="order()">Order Sekarang</button>
    <div class="small-btn" onclick="benefit()">Keuntungan?</div>
  </div>
</main>

<script>
function update(){
  const v=document.getElementById("produk").value.split("|");
  document.getElementById("harga").innerText=
    "Rp "+Number(v[1]).toLocaleString("id-ID");
}
function order(){
  const v=document.getElementById("produk").value.split("|");
  const msg=`Hallo saya mau order!\nNama produk : ${v[0]}\nHarga : Rp ${Number(v[1]).toLocaleString("id-ID")}`;
  window.open(`https://wa.me/6283128490718?text=${encodeURIComponent(msg)}`);
}
function benefit(){
  const p=document.getElementById("produk").value.split("|")[0];
  location.href=`benefit.html?produk=${encodeURIComponent(p)}`;
}
</script>

</body>
</html>
