<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reseller Jasteb | CuxxyzHost</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#020617;
  --neon:#00f7ff;
  --neon2:#7c4dff;
  --text:#e5e7eb;
  --border:#1f2937;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'JetBrains Mono', monospace;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}
canvas{position:fixed;inset:0;z-index:-1}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:22px 26px;
}
.logo{
  font-family:'Orbitron', sans-serif;
  font-size:22px;
  color:var(--neon);
  text-shadow:0 0 10px var(--neon),0 0 35px var(--neon2);
  cursor:pointer;
}
.menu{position:relative}
.menu-btn{
  width:42px;height:42px;
  border:1px solid var(--border);
  border-radius:10px;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
}
.menu-btn span,
.menu-btn span::before,
.menu-btn span::after{
  content:"";
  width:18px;height:2px;
  background:#cbd5f5;
  position:relative;
}
.menu-btn span::before{position:absolute;top:-6px}
.menu-btn span::after{position:absolute;top:6px}
.dropdown{
  display:none;
  position:absolute;
  right:0;
  top:52px;
  background:#020617;
  border:1px solid var(--border);
  border-radius:14px;
  min-width:200px;
}
.dropdown a{
  display:block;
  padding:12px 16px;
  color:var(--text);
  text-decoration:none;
}
.dropdown a:hover{background:#111827}

/* MAIN */
main{
  max-width:520px;
  margin:auto;
  padding:70px 16px 80px;
  text-align:center;
}
.title{
  font-family:'Orbitron', sans-serif;
  font-size:32px;
  color:var(--neon);
  text-shadow:0 0 14px var(--neon),0 0 45px var(--neon2);
}

/* CARD */
.card{
  margin-top:40px;
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  text-align:left;
}
.label{
  font-size:12px;
  color:#9ca3af;
  margin-bottom:6px;
}
select,.box{
  width:100%;
  padding:12px;
  border-radius:10px;
  background:#020617;
  border:1px solid var(--border);
  color:white;
  font-size:14px;
}

/* BUTTON */
.rpg-btn{
  position:relative;
  width:100%;
  padding:14px;
  margin-top:14px;
  background:#020617;
  border:1px solid var(--border);
  border-radius:14px;
  color:white;
  cursor:pointer;
  overflow:hidden;
}
.rpg-btn span{
  position:absolute;
  display:block;
  background:linear-gradient(90deg,transparent,var(--neon),var(--neon2),transparent);
}
.rpg-btn span:nth-child(1){top:0;left:-100%;width:100%;height:2px;animation:l1 2.5s linear infinite}
.rpg-btn span:nth-child(2){top:-100%;right:0;width:2px;height:100%;animation:l2 2.5s linear infinite .6s}
.rpg-btn span:nth-child(3){bottom:0;right:-100%;width:100%;height:2px;animation:l3 2.5s linear infinite 1.2s}
.rpg-btn span:nth-child(4){bottom:-100%;left:0;width:2px;height:100%;animation:l4 2.5s linear infinite 1.8s}
@keyframes l1{to{left:100%}}
@keyframes l2{to{top:100%}}
@keyframes l3{to{right:100%}}
@keyframes l4{to{bottom:100%}}

.small-btn{
  margin-top:12px;
  font-size:12px;
  color:#7dd3fc;
  text-align:center;
  cursor:pointer;
  text-decoration:underline;
}
</style>
</head>
<body>

<canvas id="particle"></canvas>

<header>
  <div class="logo" onclick="location.href='index.html'">./CuxxyzHost</div>
  <div class="menu">
    <div class="menu-btn" onclick="toggleMenu()"><span></span></div>
    <div class="dropdown" id="dropdown">
      <a href="index.html">Home</a>
      <a href="https://wa.me/6283128490718" target="_blank">WhatsApp</a>
      <a href="https://t.me/cuxxyzhost" target="_blank">Telegram</a>
    </div>
  </div>
</header>

<main>
  <div class="title">&gt;_ Reseller-Jasteb</div>

  <div class="card">
    <div class="label">_produk</div>
    <select id="produk" onchange="updatePrice()">
      <option value="Pt-Jasteb|10000">Pt-Jasteb</option>
      <option value="Team-Jasteb|10000">Team-Jasteb</option>
      <option value="Panel-Prib|15000">Panel-Prib</option>
      <option value="Reseller-Panel|6000">Reseller-Panel</option>
    </select>

    <div class="label" style="margin-top:14px">_harga</div>
    <div class="box" id="harga">Rp 10.000</div>

    <button class="rpg-btn" onclick="orderWA()">
      <span></span><span></span><span></span><span></span>
      Order via WhatsApp
    </button>

    <button class="rpg-btn" onclick="orderTele()">
      <span></span><span></span><span></span><span></span>
      Order via Telegram
    </button>

    <div class="small-btn" onclick="benefit()">Keuntungan?</div>
  </div>
</main>

<script>
function toggleMenu(){
  const d=document.getElementById("dropdown");
  d.style.display=d.style.display==="block"?"none":"block";
}

function updatePrice(){
  const v=document.getElementById("produk").value.split("|");
  document.getElementById("harga").innerText=
    "Rp "+Number(v[1]).toLocaleString("id-ID");
}

function buildMsg(){
  const v=document.getElementById("produk").value.split("|");
  return `Hallo saya mau order!\nNama produk : ${v[0]}\nHarga : Rp ${Number(v[1]).toLocaleString("id-ID")}`;
}

function orderWA(){
  window.open(`https://wa.me/6283128490718?text=${encodeURIComponent(buildMsg())}`);
}
function orderTele(){
  window.open(`https://t.me/cuxxyzhost?text=${encodeURIComponent(buildMsg())}`);
}

function benefit(){
  const p=document.getElementById("produk").value.split("|")[0];
  location.href=`benefit.html?produk=${encodeURIComponent(p)}`;
}

/* PARTICLE */
const c=document.getElementById("particle"),ctx=c.getContext("2d");
let w,h,p=[];
function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();onresize=resize;
for(let i=0;i<70;i++){
  p.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,r:Math.random()*2+1});
}
(function draw(){
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle="rgba(0,247,255,.4)";
  p.forEach(o=>{
    o.x+=o.vx;o.y+=o.vy;
    if(o.x<0||o.x>w)o.vx*=-1;
    if(o.y<0||o.y>h)o.vy*=-1;
    ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();
  });
  requestAnimationFrame(draw);
})();
</script>

</body>
</html>
