<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benefit | CuxxyzHost</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#020617;
  --neon:#00f7ff;
  --neon2:#7c4dff;
  --text:#e5e7eb;
  --border:#1f2937;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'JetBrains Mono', monospace;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}
canvas{position:fixed;inset:0;z-index:-1}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:22px 26px;
}
.logo{
  font-family:'Orbitron', sans-serif;
  font-size:20px;
  color:var(--neon);
  text-shadow:0 0 12px var(--neon),0 0 35px var(--neon2);
  cursor:pointer;
}

/* MAIN */
main{
  max-width:540px;
  margin:auto;
  padding:70px 18px 90px;
}
.title{
  text-align:center;
  font-family:'Orbitron', sans-serif;
  font-size:30px;
  color:var(--neon);
  text-shadow:0 0 14px var(--neon),0 0 45px var(--neon2);
  margin-bottom:30px;
}

/* CARD */
.card{
  background:rgba(2,6,23,.75);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
}
.card pre{
  white-space:pre-wrap;
  font-size:13px;
  line-height:1.6;
}

/* BUTTON */
.rpg-btn{
  position:relative;
  width:100%;
  padding:14px;
  margin-top:26px;
  background:#020617;
  border:1px solid var(--border);
  border-radius:14px;
  color:white;
  cursor:pointer;
  overflow:hidden;
}
.rpg-btn span{
  position:absolute;
  display:block;
  background:linear-gradient(90deg,transparent,var(--neon),var(--neon2),transparent);
}
.rpg-btn span:nth-child(1){top:0;left:-100%;width:100%;height:2px;animation:l1 2.5s linear infinite}
.rpg-btn span:nth-child(2){top:-100%;right:0;width:2px;height:100%;animation:l2 2.5s linear infinite .6s}
.rpg-btn span:nth-child(3){bottom:0;right:-100%;width:100%;height:2px;animation:l3 2.5s linear infinite 1.2s}
.rpg-btn span:nth-child(4){bottom:-100%;left:0;width:2px;height:100%;animation:l4 2.5s linear infinite 1.8s}
@keyframes l1{to{left:100%}}
@keyframes l2{to{top:100%}}
@keyframes l3{to{right:100%}}
@keyframes l4{to{bottom:100%}}
</style>
</head>
<body>

<canvas id="particle"></canvas>

<header>
  <div class="logo" onclick="history.back()">← Back</div>
</header>

<main>
  <div class="title" id="title"></div>

  <div class="card">
    <pre id="content"></pre>
  </div>

  <button class="rpg-btn" onclick="history.back()">
    <span></span><span></span><span></span><span></span>
    Kembali ke Produk
  </button>
</main>

<script>
/* DATA BENEFIT */
const data={
 "Pt-Jasteb":`$ Benefit
• Dapat 2 panel gb
• Bisa open jasteb/unchek
• bisa open ecer/jijel
• Cek² sendiri
• Stok akun gg²
• Ress 100% murni

Jamin balmod jutaan,asal niat open`,

 "Team-Jasteb":`$ Benefit
• Dapat Create panel
• Dapat pusat deres
• bisa buat panel jasteb
• bisa open pt
• Bisa open jual panel
• bisa open jasteb/unchek
• bisa open ecer/jimel
• cek² sendiri
• Stok akun gg²
• ress 100% murni

Jamin balmod jutaan,asal niat open`,

 "Panel-Prib":`$ Benefit
• Dapat 2 panel prib
• Panel mokad di ganti
• bisa open pt
• bisa open jasteb/unchek
• open ecer/jimel
• cek" sepuasnya
• stok akun gg²
• ress 100% murni

Jamin balmod jutaan,asal niat open`,

 "Reseller-Panel":`$ Benefit
• Dapat 1 panel prib
• Panel mokad di ganti
• bisa open jual panel
• bisa open jasteb/unchek
• open ecer/jimel
• cek² sepuasnya
• stok akun gg²
• ress 100% murni

Jamin balmod jutaan,asal niat open`
};

/* LOAD DATA */
const p=new URLSearchParams(location.search).get("produk");
document.getElementById("title").innerText=">_ "+p;
document.getElementById("content").innerText=data[p] || "Produk tidak ditemukan";

/* PARTICLE */
const c=document.getElementById("particle"),ctx=c.getContext("2d");
let w,h,pnt=[];
function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
resize();onresize=resize;
for(let i=0;i<70;i++){
  pnt.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,r:Math.random()*2+1});
}
(function draw(){
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle="rgba(0,247,255,.4)";
  pnt.forEach(o=>{
    o.x+=o.vx;o.y+=o.vy;
    if(o.x<0||o.x>w)o.vx*=-1;
    if(o.y<0||o.y>h)o.vy*=-1;
    ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();
  });
  requestAnimationFrame(draw);
})();
</script>

</body>
</html>
